<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image"
    content="https://raw.githubusercontent.com/sojijr/valentine-website/main/public/images/heart.png">
  <link rel="icon" href="public/images/heart.png" type="image/x-icon" />
  <title>Happy Valentine's Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;700&display=swap"
    rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="public/style.css">
</head>

<body>
  <canvas id="starfield"></canvas>

  <div id="loginContainer">
    <h2 id="loginTitle">When is our first date?</h2>
    <div class="input-group">
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <span class="separator">/</span>
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <span class="separator">/</span>
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
    </div>
    <button id="submitDate">Submit</button>
  </div>

  <div id="quizContainer" style="display: none;">
    <h2 id="questionText">Question goes here?</h2>
    <div id="optionsContainer">
      <!-- Options will be here -->
    </div>
    <div id="scoreContainer" style="display: none;">
      <h2>Quiz Completed!</h2>
      <p id="scoreText">Your Score: 0/0</p>
      <button id="finishQuiz">See Message ❤</button>
    </div>
  </div>

  <button id="startButton" style="display:none;">Begin Journey ❤</button>

  <!-- Map Container -->
  <div id="mapContainer">
    <div id="map"></div>
  </div>

  <!-- Final Heart Container -->
  <div id="finalHeartContainer">
    <div id="finalHeart">
      <svg viewBox="0 0 32 29.6">
        <path fill="#e91e63" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
          c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" />
      </svg>
      <div id="heartMessage">
        It would take 3 days 11 hours (364km) of nonstop walking to reach you, but my heart has always been right beside
        you.
      </div>
    </div>
  </div>
  <button id="valentinesButton">Click Me! ❤</button>

  <div id="loveQuestionContainer"
    style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 1000; background: rgba(0, 0, 0, 0.6); padding: 30px; border-radius: 20px; border: 2px solid #e91e63; backdrop-filter: blur(5px); width: 80%; max-width: 500px;">
    <h2 id="questionTitle"
      style="font-family: 'Great Vibes', cursive; color: #ffeb3b; font-size: 2.5em; margin-bottom: 20px;">Do you love
      me?</h2>
    <div style="display: flex; justify-content: center; gap: 20px;">
      <button id="yesBtn"
        style="background: #e91e63; color: white; border: none; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-size: 1.2em;">Yes
        i love you</button>
      <button id="noBtn"
        style="background: #555; color: white; border: none; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-size: 1.2em;">No</button>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
