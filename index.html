<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image"
    content="https://raw.githubusercontent.com/sojijr/valentine-website/main/public/images/heart.png">
  <link rel="icon" href="public/images/heart.png" type="image/x-icon" />
  <title>Happy Valentine's Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;700&display=swap"
    rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="public/style.css">
</head>

<body>
  <canvas id="starfield"></canvas>

  <div class="soundcloud-container">
    <iframe width="100%" height="20" scrolling="no" frameborder="no" allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/beabadoobee/beabadoobee-glue-song&color=%23e91e63&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
    </iframe>
  </div>

  <div id="loginContainer">
    <h2 id="loginTitle">When is our official dating date?</h2>
    <div class="input-group">
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <span class="separator">/</span>
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <span class="separator">/</span>
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
      <input type="text" maxlength="1" class="date-input" />
    </div>
    <button id="submitDate">Submit</button>
  </div>

  <div id="quizContainer" style="display: none;">
    <h2 id="questionText">Question goes here?</h2>
    <div id="optionsContainer">
      <!-- Options will be here -->
    </div>
    <div id="scoreContainer" style="display: none;">
      <h2>Quiz Completed!</h2>
      <p id="scoreText">Your Score: 0/0</p>
      <button id="finishQuiz">See Message ❤</button>
    </div>
  </div>

  <button id="startButton" style="display:none;">Begin Journey ❤</button>

  <!-- Map Container -->
  <div id="mapContainer">
    <div id="map"></div>
  </div>


  <!-- Final Heart Container -->
  <div id="finalHeartContainer">
    <div id="finalHeart">
      <svg viewBox="0 0 32 29.6">
        <path fill="#e91e63" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
          c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" />
      </svg>
      <div id="heartMessage">
        It would take 3 days 11 hours (364km) of nonstop walking to reach you, but my heart has always been right beside
        you.
      </div>
    </div>
  </div>

  <div id="loveQuestionContainer" style="display: none;">
    <h2 id="questionTitle">Do you love me?</h2>
    <div id="loveButtonContainer">
      <button id="yesBtn">Yes I love you</button>
      <button id="noBtn">No</button>
    </div>
  </div>


  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
